description: SentinelRAG answer-quality gate
prompts:
  - "{{question}}"
providers:
  - id: http
    config:
      url: http://localhost:8080/ask
      method: POST
      headers:
        Content-Type: application/json
        X-API-Key: "{{env.APP_API_KEY}}"
      body:
        question: "{{prompt}}"
      transformResponse: json.answer
defaultTest:
  assert:
    - type: latency
      threshold: 30000 # allows one retry after a transient 503 from Gemini
tests:
  - vars: { question: "What is the availability SLO for checkout-api?" }
    assert:
      - type: icontains
        value: "99.9"
  - vars: { question: "Errors are high and we deployed an hour ago. What should I do first?" }
    assert:
      - type: icontains-any
        value: ["roll back", "rollback", "previous"]
  - vars: { question: "How many minutes of downtime does a 99.9% SLO allow over 30 days?" }
    assert:
      - type: icontains
        value: "43.2"
  - vars: { question: "What is the current status of payments-api?" }
    assert:
      - type: icontains
        value: "degraded"
  - vars: { question: "When does the on-call rotation change?" }
    assert:
      - type: icontains
        value: "Monday"
  - vars: { question: "Who won the 1998 FIFA World Cup?" } # hallucination guard
    assert:
      - type: icontains-any
        value: ["don't know", "do not know", "not in the", "cannot"]
